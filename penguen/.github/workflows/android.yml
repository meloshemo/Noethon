# The Android package, built on demand.
#
# Play's copy of this game is not a shell around a website: the whole game —
# all 76 levels, the endless mode, the daily — is one self-contained HTML file
# built by `tools/bundle.mjs` and shipped inside the package. The application
# has no network permission and nothing to download, so it plays the same on a
# plane as it does on wifi.
#
# Run it from the Actions tab (Run workflow) and take the result from the run's
# artifacts:
#
#   pengu-android/app-release.aab   → Play Console'a yüklenen dosya
#   pengu-android/app-debug.apk     → telefona kurup denemek için
#
# Signing is optional and lives in repository secrets. Without them the bundle
# comes out unsigned — enough to prove the build works and to sideload the
# debug APK, not enough for Play. With them the bundle is ready to upload:
#
#   ANDROID_KEYSTORE_BASE64   base64 -w0 android.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#   ANDROID_KEY_ALIAS         (varsayılan: pengu)
#
# That keystore is made once and has to be kept: lose it and this application
# can never be updated again. See docs/MAGAZA.md §5.
name: Android paketi

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'versionCode (Play her yüklemede artan bir tamsayı istiyor)'
        required: false
        default: ''
      versionName:
        description: 'Sürüm adı (x.y.z)'
        required: false
        default: ''

jobs:
  build:
    name: Paketi üret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The Android Gradle Plugin wants JDK 17; the runner's default is newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Oyunu pakete koy
        run: |
          node tools/android.mjs \
            ${{ inputs.versionCode != '' && format('--code={0}', inputs.versionCode) || '' }} \
            ${{ inputs.versionName != '' && format('--name={0}', inputs.versionName) || '' }}

      # The runner's own Gradle, so there is no wrapper jar in the repository:
      # a binary nobody can read, kept in a project whose whole point is that
      # every file in it can be read.
      - name: Paketle
        working-directory: android
        run: gradle --no-daemon bundleRelease assembleDebug

      - name: İmzala
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          alias_name="${KEY_ALIAS:-pengu}"
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          "$JAVA_HOME/bin/jarsigner" \
            -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            android/app/build/outputs/bundle/release/app-release.aab "$alias_name"
          rm -f "$RUNNER_TEMP/upload.keystore"
          echo "imzalandı"

      - name: Toparla
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/
          cp android/app/build/outputs/apk/debug/app-debug.apk out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: pengu-android
          path: out/
          retention-days: 30
