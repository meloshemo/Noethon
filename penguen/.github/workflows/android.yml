# The Android package, built on demand.
#
# Play's copy of this game is a TWA — a thin shell around the published
# address — and this builds it. Run it from the Actions tab (Run workflow) and
# download the result from the run's artifacts.
#
# What comes out:
#
#   pengu-android/app-release.aab          → Play Console'a yüklenen dosya
#   pengu-android/app-debug.apk            → telefona kurup denemek için
#   pengu-android/assetlinks.json          → imza varsa, siteye konacak dosya
#
# Signing is optional and lives in repository secrets. Without them the bundle
# comes out unsigned — enough to prove the build works and to sideload the
# debug APK, not enough for Play. With them the bundle is ready to upload:
#
#   ANDROID_KEYSTORE_BASE64   base64 -w0 android.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#   ANDROID_KEY_ALIAS         (varsayılan: pengu)
#
# Making that keystore is one command and it has to be kept: lose it and this
# application can never be updated again. See docs/MAGAZA.md §5.
name: Android paketi (TWA)

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Android versionCode (her yüklemede artmalı)'
        required: false
        default: ''
      versionName:
        description: 'Sürüm adı (x.y.z)'
        required: false
        default: ''

jobs:
  build:
    name: Paketi üret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The TWA template is built with a toolchain that wants JDK 17; the
      # runner's default is newer and Gradle refuses it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sürüm numaralarını yaz
        if: inputs.versionCode != '' || inputs.versionName != ''
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/twa-manifest.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const code = process.env.VCODE, name = process.env.VNAME;
            if (code) { j.appVersionCode = Number(code); }
            if (name) { j.appVersionName = name; j.appVersion = name; }
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log("versionCode", j.appVersionCode, "versionName", j.appVersionName);
          '
        env:
          VCODE: ${{ inputs.versionCode }}
          VNAME: ${{ inputs.versionName }}

      - name: Bubblewrap
        run: npm install --no-save @bubblewrap/core

      - name: Android projesini üret
        run: node tools/twa.mjs

      - name: Paketle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug

      - name: İmzala
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          alias_name="${KEY_ALIAS:-pengu}"
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          "$JAVA_HOME/bin/jarsigner" \
            -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            android/app/build/outputs/bundle/release/app-release.aab "$alias_name"
          # The fingerprint the site has to publish for the address bar to go
          # away. With Play App Signing the one that matters is Google's, not
          # this one — see docs/MAGAZA.md §6 — but for a sideloaded test build
          # this is the right answer.
          fp=$("$JAVA_HOME/bin/keytool" -list -v \
                -keystore "$RUNNER_TEMP/upload.keystore" \
                -storepass "$STORE_PASS" -alias "$alias_name" \
              | grep -oE 'SHA256: [0-9A-F:]+' | head -1 | cut -d' ' -f2)
          node -e '
            const fs = require("fs");
            const id = JSON.parse(fs.readFileSync("android/twa-manifest.json", "utf8")).packageId;
            fs.writeFileSync("assetlinks.json", JSON.stringify([{
              relation: ["delegate_permission/common.handle_all_urls"],
              target: {
                namespace: "android_app",
                package_name: id,
                sha256_cert_fingerprints: [process.env.FP],
              },
            }], null, 2) + "\n");
          '
          rm -f "$RUNNER_TEMP/upload.keystore"
        continue-on-error: false

      - name: Toparla
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/ 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ 2>/dev/null || true
          cp assetlinks.json out/ 2>/dev/null || true
          cp android/twa-manifest.json out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: pengu-android
          path: out/
          retention-days: 30
