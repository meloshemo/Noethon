# Everything the project can check about itself, on every push.
#
# The node half needs nothing but node and takes about five seconds; the
# browser half needs a Chromium and takes about a minute. They are separate
# jobs so a broken level fails fast and visibly, rather than being buried
# under a browser download.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Bölümler ve kurallar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testler (tarayıcısız)
        run: node tools/test.mjs --no-browser --verbose

  browser:
    name: Mekanikler (gerçek tarayıcı)
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bağımlılıklar
        run: npm install --no-audit --no-fund
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Tarayıcı testleri
        run: node tools/test.mjs --only-browser --verbose
